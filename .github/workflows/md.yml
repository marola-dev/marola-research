# .md — the quality of the Markdown files of every research, with three analysers from the
# flake's `md` shell (`just md-quality`): markdownlint-cli2 for the structure, Vale for the prose
# rules of the ouro-paper skill, lychee for links to files and headings that do not exist. No
# network here: web links are the `live links` workflow's. Each analyser is first given a bad
# file and must refuse it.
name: .md

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --no-update-lock-file .#md --command scripts/md-quality.sh --self-test
      - run: nix develop --no-update-lock-file .#md --command scripts/md-quality.sh
      - name: the slip box of each research keeps its rules
        run: for d in */notes; do scripts/notes-check.sh "${d%%/*}"; done
      - name: the citation files are what each research's metadata makes
        run: |
          python3 scripts/citation.py --self-test
          for f in */zenodo.json; do python3 scripts/citation.py "${f%%/*}" --check; done
      - name: the DOI of each released research is in every place
        run: for f in */doi.tsv; do scripts/doi-check.sh "${f%%/*}"; done
      - name: each research overrides the root only as OVERRIDE_CONFIG.toml allows
        run: python3 scripts/override-check.py --self-test && python3 scripts/override-check.py
      - name: every file has a licence and a copyright
        run: nix develop --no-update-lock-file .#md --command reuse lint
